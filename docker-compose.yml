services:
  # ============================================================================
  # 1. MongoDB Database Service
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: campustrack-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-student_attendance_db}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campustrack-network

  # ============================================================================
  # 2. Node.js / Express Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campustrack-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/student_attendance_db}
      JWT_SECRET: ${JWT_SECRET:-campustrack_production_jwt_secret_2026_secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - campustrack-network

  # ============================================================================
  # 3. React / Vite Frontend Service (Served via Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    container_name: campustrack-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - campustrack-network

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  mongodb_data:
    driver: local

# ==============================================================================
# Bridge Network for Inter-Container Communication
# ==============================================================================
networks:
  campustrack-network:
    driver: bridge
